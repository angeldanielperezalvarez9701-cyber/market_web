<div class="error-container">
  <div class="error-card p-shadow-6">
    
    <div class="error-image">
      <img src="assets/error-illustration.svg" alt="Error">
    </div>

    <h1 class="error-title">Opps 😕</h1>

    <p class="error-message">
      Ocurrió un error. Inténtelo más tarde o póngase en contacto con soporte.
    </p>

    <div class="error-actions">
      <button pButton type="button" label="Volver al inicio" icon="pi pi-home" (click)="goHome()"></button>
    </div>

  </div>
</div>
