<div class="container mx-auto">

    <div class="grid flex justify-content-center">
        <div class="contenido sm:col-12 md:col-12 lg:col-12 xl:col-12">
            <div class="grid titulo flex justify-content-center mt-1">
                <div class="descripTitulo sm:col-12 md:col-12 lg:col-12 xl:col-12">
                    <h2><i class="pi pi-list-check"></i>Lista tipo muebles</h2>
                </div>

            </div>
            <div class="grid  div-form flex justify-content-center mt-3 ">
                <div class="sm:col-12 md:col-12 lg:col-12 xl:col-12">
                    
                    <div class="card divSombreados ml-3">

                        <p-table #dt2 [value]="servicioMueble.tipoMueble()" dataKey="idMueble" [rows]="10"
                            [paginator]="true" [rowsPerPageOptions]="[10, 25, 50]"
                            [globalFilterFields]="['nombreMueble', 'numeroMueble', 'tipoMueble.nombreTipoMueble']"
                            [tableStyle]="{ 'min-width': '50rem' }">
                            <ng-template #caption>
                                <div class="flex items-center justify-between">
                                    <span class="text-xl font-bold mt-2">Tipo Muebles</span>
                                    <p-button icon="pi pi-refresh" class="ml-4 " rounded raised />
                                    <p-iconfield iconPosition="left" class="ml-auto">
                                        <p-inputicon>
                                            <i class="pi pi-search"></i>
                                        </p-inputicon>
                                        <input pInputText type="text" class="inputText"
                                            (input)="dt2.filterGlobal($event.target.value, 'contains')"
                                            placeholder="Buscar mueble" />
                                    </p-iconfield>
                                </div>
                            </ng-template>
                            <ng-template #header>
                                <tr>
                                    <th>Tipo Mueble</th>
                                    <th>Descripción</th>
                                    <th class="text-center ">Editar</th>
                                    <th class="text-center ">Eliminar</th>
                                </tr>
                            </ng-template>
                            <ng-template #body let-muebletipo>
                                <tr>
                                    <td>{{ muebletipo.nombreTipoMueble }}</td>
                                    <td>{{ muebletipo.descripcionMueble }}</td>
            
                                    <td class="text-center ">
                                        <p-button icon="pi pi-pencil" severity="secondary" rounded type="button"
                                            (click)="consultaTipoM(muebletipo)" />
                                    </td>
                                    <td class="text-center ">
                                        <p-button icon="pi pi-trash" severity="secondary" rounded (click)="confirm($event ,muebletipo)" />
                                    </td>
                                </tr>
                            </ng-template>
                        </p-table>

                    </div>
                </div>
            
            </div>
        </div>
    </div>
