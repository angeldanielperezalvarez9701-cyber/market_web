<div class="container mx-auto">

    <div class="grid flex justify-content-center">
        <div class="contenido sm:col-12 md:col-12 lg:col-12 xl:col-12">
            <div class="grid titulo flex justify-content-center mt-1  "
                [ngClass]="{'ocultar-div' : ui.contenedorMueble}">
                <div class="descripTitulo sm:col-12 md:col-12 lg:col-12 xl:col-12">
                    <h1><i class="pi pi-list-check"></i>{{ui.tituloMueble}}</h1>
                </div>

            </div>
            <div class="grid  div-form flex justify-content-center mt-3 ">
                <div class="sm:col-12 md:col-12 lg:col-12 xl:col-12" [ngClass]="{'ocultar-div' : ui.contenedorMueble}">
                    <div
                        class="grid   sm:col-12 md:col-12 lg:col-12 xl:col-12 mt-2 div-buton flex justify-content-center">
                        <div
                            class="grid comboBotones bt sm:col-12 md:col-10 lg:col-12 xl:col-12 flex justify-content-end flex-wrap">
                            <div
                                class="botonAceptrar sm:col-12 md:col-12 lg:col-6 xl:col-6  flex justify-content-center">
                                <p-splitbutton label="Agregar Mueble" (onClick)="agregarMueble()" [model]="items"
                                    severity="contrast" [rounded]="true" icon="pi pi-check-circle" />

                            </div>
                        </div>
                    </div>
                    <div class="card divSombreados ml-3">

                        <p-table #dt2 [value]="servicioMueble.muebles()" dataKey="idMueble" [rows]="10"
                            [paginator]="true" [rowsPerPageOptions]="[10, 25, 50]"
                            [globalFilterFields]="['nombreMueble', 'numeroMueble', 'tipoMueble.nombreTipoMueble']"
                            [tableStyle]="{ 'min-width': '50rem' }">
                            <ng-template #caption>
                                <div class="flex items-center justify-between">
                                    <span class="text-xl font-bold mt-2">Muebles</span>
                                    <p-button icon="pi pi-refresh" class="ml-4 " rounded raised />
                                    <p-iconfield iconPosition="left" class="ml-auto">
                                        <p-inputicon>
                                            <i class="pi pi-search"></i>
                                        </p-inputicon>
                                        <input pInputText type="text" class="inputText"
                                            (input)="dt2.filterGlobal($event.target.value, 'contains')"
                                            placeholder="Buscar mueble" />
                                    </p-iconfield>
                                </div>
                            </ng-template>
                            <ng-template #header>
                                <tr>
                                    <th>Mueble</th>
                                    <th>Numero</th>
                                    <th>Tipo</th>
                                    <th>Descripción</th>
                                    <th class="text-center ">Ver</th>
                                    <th class="text-center ">Eliminar</th>
                                </tr>
                            </ng-template>
                            <ng-template #body let-mueble>
                                <tr>
                                    <td>{{ mueble.nombreMueble }}</td>
                                    <td>{{ mueble.numeroMueble }}</td>
                                    @if (mueble.tipoMueble !=null) {
                                        <td>{{mueble.tipoMueble.nombreTipoMueble }}</td>
                                    }@else {
                                        <td>'SN'</td>
                                    }
                                    <td>{{ mueble.descripcionMueble}}</td>
                                    <td class="text-center ">
                                        <p-button icon="pi pi-eye" severity="secondary" rounded
                                            (click)="verMueble(mueble)" />
                                    </td>
                                    <td class="text-center ">
                                        <p-button icon="pi pi-trash" severity="secondary" rounded />
                                    </td>
                                </tr>
                            </ng-template>
                        </p-table>

                    </div>

                    <hr class="mt-7 ml-2">

                    <div class="sm:col-12 md:col-12 lg:col-12 xl:col-12 ">
                        <app-lista-tipo-m></app-lista-tipo-m>
                    </div>

                </div>
                <div class="sm:col-12 md:col-12 lg:col-12 xl:col-12" [ngClass]="{'ocultar-div' : ui.visualizaMueble}">
                    <app-visualiza-mueble></app-visualiza-mueble>
                </div>

                @if(ui.verRepisass() === true){
                <div class="sm:col-12 md:col-12 lg:col-12 xl:col-12">
                    <app-visualiza-repisa></app-visualiza-repisa>
                </div>
                }

            </div>
        </div>
    </div>
