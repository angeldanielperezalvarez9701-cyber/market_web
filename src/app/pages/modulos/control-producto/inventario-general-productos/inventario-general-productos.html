<div class="container mx-auto">

    <div class="grid flex justify-content-center">
        <div class="contenido sm:col-12 md:col-12 lg:col-12 xl:col-12">
            <div class="grid titulo flex justify-content-center mt-1  ">
                <div class="descripTitulo sm:col-12 md:col-10 lg:col-10 xl:col-10">
                    <h1><i class="pi pi-list-check"></i>Inventario</h1>
                </div>
                <div class="sm:col-12 md:col-10 lg:col-10 xl:col-10">
                    <p-button label="Regresar" icon="pi pi-arrow-left" severity="secondary"
                        (onClick)="ui. muestraContenedorPrincipal('listaProducto')" />
                </div>
            </div>


             <div class="grid flex justify-content-center mt-3">

                <div class="grid control-producto sm:col-12 md:col-10 lg:col-10 xl:col-10 flex justify-content-center ">

                    <div class="ver-productos inventarioGeneral caja-producto mr-3 sm:col-12 md:col-6 lg:col-6 xl:col-6 flex justify-content-center flex-wrap align-items-center"
                       >
                        <div class="descripcion">
                            <h2 class="des-text">Inventario General</h2>
                            <p class="des-text">Para ver los productos en existencia da click</p>
                        </div>
                    </div>
                    <div class="grid sm:col-12  md:col-6 lg:col-6 xl:col-6 flex flex-column">
                        <div class="porAlmacen  caja-producto div-grup col-12 md:col-12 lg:col-12 xl:col-12 flex justify-content-center flex-wrap align-items-center"
                            >
                            <div class="descripcion">
                                <h2 class="des-text">Inventario Por Tienda</h2>
                                <p class="des-text">Inventario por tienda da click</p>
                            </div>
                        </div>

                        <div class="control-producto-div caja-producto almacen  porTienda div-grup col-12 md:col-12 lg:col-12 xl:col-12 flex justify-content-center flex-wrap align-items-center"
                            >
                            <div class="descripcion">
                                <h2 class="des-text">Inventario por almacén</h2>
                                <p class="des-text">Inventario por almacen da click</p>
                            </div>
                        </div>

                    </div>



        </div>
    </div>
</div>
